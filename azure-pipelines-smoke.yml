trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - template: poof.yml
    parameters:
      version: "v0.6.0"
      packages: "pirafrank/vault-conductor@v0.3.0"

  - bash: |
      set -euo pipefail
      poof --version
      vault-conductor --version
    displayName: Verify poof and installed package
